<!doctype html>
<html><head><meta charset="utf-8"><title>Fixture hydrate</title></head><body>
<h1>Fixture hydrate</h1>
<input aria-label="Name"> <button id="go">Open</button> <p role="status"></p>
<script>
// Mimics SSR + late hydration: the input gets a __react* key and the button a handler only after 1.5 s.
setTimeout(() => {
  document.querySelector('input')['__reactFiber$fixture'] = {};
  document.getElementById('go').addEventListener('click', () => {
    document.querySelector('[role=status]').textContent = 'opened';
    window.onbeforeunload = (e) => { e.preventDefault(); e.returnValue = ''; };
  });
}, 1500);
</script>
</body></html>
